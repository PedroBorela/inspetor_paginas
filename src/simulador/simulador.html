<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Garimpo · simulador</title>
  <link rel="stylesheet" href="simulador.css">
  <script type="module" src="simulador.js"></script>
</head>
<body>
  <div class="barra" role="toolbar" aria-label="Simulador de dispositivos">
    <select id="disp" aria-label="Dispositivo"></select>
    <div class="medidas">
      <input id="w" type="number" min="200" max="3840" aria-label="Largura">
      <span>×</span>
      <input id="h" type="number" min="200" max="3840" aria-label="Altura">
    </div>
    <button id="girar" class="ico" title="Girar (R)" aria-label="Girar">
      <svg viewBox="0 0 16 16" width="16" height="16"><rect x="4.5" y="2" width="7" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 6.5a6 6 0 0 1 2.5-3.8M1.6 2.6v3.6h3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 .5)"/></svg>
    </button>
    <select id="zoom" aria-label="Zoom">
      <option value="ajustar">Ajustar</option>
      <option value="1">100%</option>
      <option value="0.75">75%</option>
      <option value="0.5">50%</option>
      <option value="0.33">33%</option>
    </select>
    <button id="recarregar" class="ico" title="Recarregar a página simulada" aria-label="Recarregar">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="info" id="info"></span>
    <button id="fechar" class="ico" title="Fechar (Esc)" aria-label="Fechar simulador">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="palco" id="palco">
    <div class="envelope" id="envelope">
      <div class="aparelho" id="aparelho">
        <iframe id="tela" title="Página simulada"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-pointer-lock allow-presentation"
          allow="clipboard-write; fullscreen; autoplay"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
